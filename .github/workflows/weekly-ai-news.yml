name: Weekly AI news digest

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Belgrade"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-ai-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUMMARY_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-sonnet-5
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NEWS_AGENT_DB: data/news-agent.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: python -m pip install -e .

      - name: Restore sent-item history
        uses: actions/cache@v4
        with:
          path: data/news-agent.sqlite3
          key: news-agent-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-agent-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Send digest
        run: news-agent run
