[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-trends-agents"
version = "0.1.0"
description = "Modular agents for collecting, summarizing, and delivering news and trends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.52,<1",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "openai>=1.30,<2",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
news-agent = "news_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

